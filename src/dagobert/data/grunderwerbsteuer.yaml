# Grunderwerbsteuer by Land: the rate as a share of the price, from the day `since` on.
#
# §11 Abs. 1 GrEStG sets 3.5% since 1997-01-01 (Jahressteuergesetz 1997). Since 2006-09-01 a Land
# may set its own rate (Art. 105 Abs. 2a S. 2 GG). A rate holds for a purchase that is
# "verwirklicht" on or after its day, as a rule the notarial contract.
#
# The dates and rates follow the table "Steuersätze" of the article "Grunderwerbsteuer
# (Deutschland)" of the German Wikipedia (read 2026-10-13). The rates of today agree with
# steuern.de of 2026-07-06 and with the sources named for each Land below (read 2026-10-12):
# "PwC" is the PwC table of the laws of the Länder, which still shows 4.5% for HH (stale), so it
# names the dates only. A proposal of 2026-10 to cut the rate of NW to 5% in 2027 is no law yet.
# Keys: the ISO 3166-2:DE codes without `DE-`.
BW:
  - {since: 1997-01-01, rate: 0.035}
  - {since: 2011-11-05, rate: 0.05}  # PwC
BY:  # no rate of its own: §11 Abs. 1 GrEStG
  - {since: 1997-01-01, rate: 0.035}
BE:
  - {since: 1997-01-01, rate: 0.035}
  - {since: 2007-01-01, rate: 0.045}
  - {since: 2012-04-01, rate: 0.05}
  - {since: 2014-01-01, rate: 0.06}  # PwC

# Weekly updates of the lock, the image pins, the Actions and the pre-commit hooks. Not covered:
# the `docker://` gitleaks step and the uv `version` of setup-uv in the workflows.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # The lower bounds in pyproject.toml stay; uv.lock takes the new versions. Only of the
    # direct dependencies: lockfile-only raises no transitive one (dependabot-core#14073).
    versioning-strategy: lockfile-only
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Python minor goes with .python-version, by hand: the lock needs its wheels.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The gitleaks hook. Raise the `docker://` gitleaks step of ci.yml with it.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly

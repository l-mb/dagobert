  - id: bitcoin
    name: Bitcoin wallet
    kind: crypto
    value: 3180.00
    asof: 2026-10-09
    trades:
      - date: 2026-01-14
        kind: buy
        security: BTC
        name: Bitcoin
        units: 0.04
        amount: 3240.00
        fees: 12.00

  # Let since its purchase in 2018: a sale within ten years of it would be taxable. The rent pays
  # tax after the AfA, 2% of the building (completed in 1972), 70% of what the flat cost
  - id: flat
    name: Rented-out flat
    kind: property
    sqm: 54
    per_sqm: 3600
    bought_for: 172000
    upkeep: 0.01
    tags: [flat]
    asof: 2026-04-30
    bought: 2018-03-01
    building_share: 0.7
    afa: 0.02
  # Its interest is a cost of the rent
  - id: flat-loan
    name: Flat loan
    kind: loan
    balance: -97625.06
    rate: 0.015
    annuity: 560
    fixed_until: 2032-06-01
    prepayment_penalty: 0.02
    asof: 2026-09-30
    finances: flat

  # Paid by the employer, tax-free under §3 Nr. 63 EStG: so the lump sum at 67 is other income
  # (§22 Nr. 5 EStG), without the Fünftelregelung
  - id: bav
    name: Company pension
    kind: bav
    value: 23800.00
    paid: 20500.00
    contribution: 180
    phases: [work]
    matures: 2053-06-01
    guarantee: 1.0
    fuenftel: false
    asof: 2025-12-31
    update_every: 12
  # A Basisrente, no company pension: her own premium of 200 € a month while she works, and the
  # plan pays into it (fund_policy), both lower the income tax. An annuity from 67, taxed at the
  # share of its start; no health insurance on it in the statutory insurance
  - id: basisrente
    name: Basisrente
    kind: bav
    value: 0
    premium: 200
    phases: [work, new-job]
    matures: 2053-06-01
    payout: annuity
    annuity_per_10k: 32
    basisrente: true
    cost: 0.008
    asof: 2026-04-30
    update_every: 12
  # Altersvorsorgedepot: 1,800 € a year from 2027 plus the Zulage
  - id: av-depot
    name: Altersvorsorgedepot
    kind: av_depot
    value: 0
    contribution: 1800
    start: 2027-01-01
    cost: 0.0025
    asof: 2026-04-30
    update_every: 12
